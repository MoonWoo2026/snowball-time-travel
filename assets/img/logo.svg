<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1B2C"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6C77B"/>
      <stop offset="50%" stop-color="#B07A2E"/>
      <stop offset="100%" stop-color="#7A4F1E"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="72" fill="url(#bgG)"/>
  <!-- 金色描边 -->
  <rect x="8" y="8" width="496" height="496" rx="68" fill="none" stroke="#B07A2E" stroke-width="2" opacity=".5"/>

  <!-- 左半：金色雪花 -->
  <g transform="translate(128,256)">
    <g stroke="url(#goldG)" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9">
      <line x1="0" y1="-110" x2="0" y2="110"/>
      <line x1="-95" y1="-55" x2="95" y2="55"/>
      <line x1="-95" y1="55" x2="95" y2="-55"/>
    </g>
    <!-- 每根臂的 V 形 -->
    <g fill="none" stroke="#B07A2E" stroke-width="5" stroke-linecap="round">
      <polyline points="-18,-90 -8,-80 -18,-70"/>
      <polyline points="18,90 8,80 18,70"/>
      <polyline points="-85,-40 -75,-45 -70,-35"/>
      <polyline points="85,40 75,45 70,35"/>
      <polyline points="-85,40 -75,45 -70,35"/>
      <polyline points="85,-40 75,-45 70,-35"/>
    </g>
    <!-- 罗马钟面 -->
    <g transform="translate(0,138)">
      <circle r="34" fill="#B07A2E" stroke="#E6C77B" stroke-width="2"/>
      <g fill="#2B1C08" font-family="Georgia, serif" font-size="14" font-weight="700">
        <text x="0" y="-20" text-anchor="middle">XII</text>
        <text x="20" y="5" text-anchor="middle">III</text>
        <text x="0" y="28" text-anchor="middle">VI</text>
        <text x="-20" y="5" text-anchor="middle">IX</text>
      </g>
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#2B1C08" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="12" y2="2" stroke="#2B1C08" stroke-width="2" stroke-linecap="round"/>
      <circle r="3" fill="#2B1C08"/>
    </g>
  </g>

  <!-- 右半：蓝色雪花 -->
  <g transform="translate(384,256)">
    <g stroke="url(#blueG)" stroke-width="10" stroke-linecap="round" fill="none" opacity=".9">
      <line x1="0" y1="-110" x2="0" y2="110"/>
      <line x1="-95" y1="-55" x2="95" y2="55"/>
      <line x1="-95" y1="55" x2="95" y2="-55"/>
    </g>
    <g fill="none" stroke="#5B9BD5" stroke-width="5" stroke-linecap="round">
      <polyline points="-18,-90 -8,-80 -18,-70"/>
      <polyline points="18,90 8,80 18,70"/>
      <polyline points="-85,-40 -75,-45 -70,-35"/>
      <polyline points="85,40 75,45 70,35"/>
      <polyline points="-85,40 -75,45 -70,35"/>
      <polyline points="85,-40 75,-45 70,-35"/>
    </g>
    <!-- K 线蜡烛 -->
    <g transform="translate(0,138)">
      <!-- 三根蜡烛：跌/涨/涨 -->
      <g transform="translate(-30,0)">
        <line x1="0" y1="-30" x2="0" y2="30" stroke="#C0453B" stroke-width="2.5"/>
        <rect x="-10" y="-16" width="20" height="20" fill="#C0453B" rx="2"/>
      </g>
      <g transform="translate(0,-6)">
        <line x1="0" y1="-26" x2="0" y2="28" stroke="#2E7D5B" stroke-width="2.5"/>
        <rect x="-10" y="-12" width="20" height="22" fill="#2E7D5B" rx="2"/>
      </g>
      <g transform="translate(30,0)">
        <line x1="0" y1="-22" x2="0" y2="24" stroke="#2E7D5B" stroke-width="2.5"/>
        <rect x="-10" y="-8" width="20" height="18" fill="#2E7D5B" rx="2"/>
      </g>
    </g>
  </g>

  <!-- 中间分割线 -->
  <line x1="256" y1="72" x2="256" y2="440" stroke="#B07A2E" stroke-width="1.5" opacity=".3"/>

  <!-- 底部文字 -->
  <text x="256" y="464" text-anchor="middle" font-family="'PingFang SC','Noto Serif SC',Georgia,serif" font-size="38" font-weight="700" fill="#E6C77B" letter-spacing="18">时 光 雪 球</text>
  <text x="256" y="492" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5B9BD5" letter-spacing="6">TIME · TRAVEL · BACKTEST</text>
</svg>
