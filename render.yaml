services:
  - type: web
    name: snowball-time-travel
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
    routes:
      - type: rewrite
        source: /
        destination: /index.html
