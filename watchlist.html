<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自选股 · 滚雪球</title>
<link rel="stylesheet" href="assets/css/app.css?v=20261109">
</head>
<body>

<header class="site-head" id="siteHead"></header>

<main class="wl-page">
  <div class="wl-head">
    <div>
      <h1>自选股</h1>
      <p>以当前复盘时点报价。点卡片进入交易终端；搜索可把新标的加入自选。</p>
    </div>
    <div class="wl-search">
      <input type="text" id="addSearch" placeholder="搜索代码 / 名称，加入自选" autocomplete="off">
      <div class="pick-results hide" id="addResults"></div>
    </div>
  </div>
  <section class="timebar wl-timebar">
    <div class="tb-date"><span>当前时点</span><b id="wlDate">--</b></div>
    <div class="tb-quick">
      <button id="wlNext">下一月</button>
      <button data-step="3m">+3月</button>
      <button data-step="6m">+6月</button>
      <button data-step="1y">+1年</button>
      <button data-step="3y">+3年</button>
      <button data-step="today" class="gold">推到现在</button>
      <span class="tb-wait">
        <input type="number" id="wlWaitY" min="0" max="40" value="0" aria-label="年"> 年
        <input type="number" id="wlWaitM" min="0" max="11" value="3" aria-label="月"> 月
        <button id="wlWaitGo">等待</button>
      </span>
      <button id="wlPlay" class="play">▶ 连续滚动</button>
    </div>
  </section>
  <div class="wl-meta">
    <span id="wlCount">--</span>
    <span id="wlNote">--</span>
  </div>
  <div class="wl-grid" id="wlGrid"></div>
</main>

<div id="toast"></div>

<script src="assets/js/store.js?v=20261109"></script>
<script src="assets/js/market.js?v=20261109"></script>
<script src="assets/js/engine.js?v=20261109"></script>
<script src="assets/js/ui.js?v=20261109"></script>
<script src="assets/js/pages/watchlist.js?v=20261109"></script>
</body>
</html>
